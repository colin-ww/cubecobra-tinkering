name: CubeCobra export -> Parquet (R port, parallel run)

# The Python converter (the existing cubecobra-sync.yml, reused as is) and the R port run side by
# side on the same export, then `compare` checks that both wrote the same Parquet.
# Once this has been green for a few runs, delete convert_to_parquet.py, cubecobra-sync.yml, the
# `py` job and `compare`, and rename this workflow.

on:
  workflow_dispatch: {}
  # Also checks every change to the converters, the tests or the R dependencies.
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - DESCRIPTION
      - .github/workflows/cubecobra-sync*.yml
  # Uncomment when you're happy with the manual runs:
  # schedule:
  #   - cron: "0 6 1 */3 *"   # 06:00 UTC, 1st of every 3rd month

jobs:
  py:
    uses: ./.github/workflows/cubecobra-sync.yml # artifact: cubecobra-parquet

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Unit tests
        shell: Rscript {0}
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)

      - name: Download raw JSON
        run: scripts/download_raw.sh

      - name: Convert JSON -> Parquet (R)
        run: Rscript scripts/convert_to_parquet.R

      - uses: actions/upload-artifact@v4
        with:
          name: cubecobra-parquet-r
          path: processed/
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: [py, r]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - uses: actions/download-artifact@v4
        with:
          name: cubecobra-parquet
          path: processed-py

      - uses: actions/download-artifact@v4
        with:
          name: cubecobra-parquet-r
          path: processed-r

      - name: Same data? (also written to the job summary)
        run: Rscript scripts/compare_parquet.R processed-py processed-r
